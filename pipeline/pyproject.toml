[project]
name = "retail-recommendation-lab"
version = "0.1.0"
description = "Synthetic retail catalog pipeline"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "pyarrow>=20,<22",
  "pyspark>=4,<5",
]

[project.scripts]
generate-catalog = "retail_recommendation_lab.catalog:generate"
validate-catalog = "retail_recommendation_lab.catalog:validate"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pyright>=1.1.403,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_recommendation_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
