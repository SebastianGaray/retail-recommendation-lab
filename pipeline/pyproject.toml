[project]
name = "retail-recommendation-lab"
version = "0.1.0"
description = "Synthetic retail catalog pipeline"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "pyarrow>=25.0.0,<26",
  "pyspark>=4,<5",
]

[project.scripts]
generate-catalog = "retail_recommendation_lab.catalog:generate"
validate-catalog = "retail_recommendation_lab.catalog:validate"
generate-events = "retail_recommendation_lab.synthetic:generate_events"
run-pipeline = "retail_recommendation_lab.spark_pipeline:pipeline"
validate-artifacts = "retail_recommendation_lab.spark_pipeline:validate_artifacts"

[dependency-groups]
dev = [
  "pre-commit>=4.2,<5",
  "pytest>=9.0.3,<10",
  "pyright>=1.1.403,<2",
  "ruff>=0.16.1,<1",
  "pytest-cov>=7.1.0",
  "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_recommendation_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
omit = ["*/spark_pipeline.py"]
