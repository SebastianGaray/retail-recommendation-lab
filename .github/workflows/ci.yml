name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync --project pipeline --locked --dev
      - run: npm ci
      - run: uv run --project pipeline generate-catalog
      - run: uv run --project pipeline validate-catalog
      - run: uv run --project pipeline run-pipeline
      - run: uv run --project pipeline validate-artifacts
      - run: git diff --exit-code -- artifacts/demo/catalog.json apps/web/public/catalog.json
      - run: git diff --exit-code -- artifacts/demo apps/web/public
      - run: uv run --project pipeline ruff check pipeline
      - run: uv run --project pipeline ruff format --check pipeline
      - run: uv run --project pipeline pyright --project pipeline/pyrightconfig.json
      - run: uv run --project pipeline pytest --cov=retail_recommendation_lab --cov-config=pipeline/pyproject.toml --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - run: uv run --project pipeline pip-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage --workspace apps/web
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: apps/web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
