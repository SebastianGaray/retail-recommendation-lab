name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync --project pipeline --locked --dev
      - run: npm ci
      - run: uv run --project pipeline generate-catalog
      - run: uv run --project pipeline validate-catalog
      - run: uv run --project pipeline run-pipeline
      - run: uv run --project pipeline validate-artifacts
      - run: git diff --exit-code -- artifacts/demo/catalog.json apps/web/public/catalog.json
      - run: git diff --exit-code -- artifacts/demo apps/web/public
      - run: uv run --project pipeline ruff check pipeline
      - run: uv run --project pipeline ruff format --check pipeline
      - run: uv run --project pipeline pyright --project pipeline/pyrightconfig.json
      - run: uv run --project pipeline pytest
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: apps/web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
